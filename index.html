  {
   "id": "slow-computer-task-manager",
   "title": "How to Check Why Your Computer Is Running Slowly",
   "summary": "Learn how to open Windows Task Manager, inspect live CPU and memory usage, and safely identify which applications are consuming your computer resources.",
   "introduction": "A sluggish or unresponsive computer is often caused by a rogue background program hogging processor cycles or running low on available RAM memory. Windows Task Manager provides real-time diagnostics so you can see exactly which program is causing the bottleneck and safely close it before calling the Helpdesk.",

    "How to safely end an unresponsive application without endangering Windows system files"

   "requirements": [
    "A computer running Windows 10 or Windows 11",
    "Standard user login access (administrator privileges not required for personal app monitoring)",
    "Keyboard and mouse connected"
   ],
   "steps": [
    {
     "stepNumber": 1,
     "title": "Open Windows Task Manager Instantly (Ctrl + Shift + Esc)",
     "instruction": "Press and hold the Ctrl and Shift keys with your left hand, then press the Esc key in the top-left corner of your keyboard with your right hand.",
     "details": [
      "This three-key combination opens Task Manager immediately without having to navigate through the Windows security screen.",
      "Alternative method: Right-click the Windows Start icon on your taskbar and click \"Task Manager\" from the pop-up list."

     "screenshotPlaceholder": {
      "id": "ss-2-1",

     }
    },
    {
     "stepNumber": 2,
     "title": "Expand to the Detailed View (\"More details\")",
     "instruction": "If Task Manager opens as a small, simple card showing only a list of app names, click the \"More details\" link (or expand arrow) at the bottom-left corner of the window.",
     "details": [
      "This reveals the complete diagnostic table with columns for CPU, Memory, Disk, Network, and GPU usage.",
      "In Windows 11, the view is structured with left-hand navigation tabs; ensure you are on the \"Processes\" tab (the top icon)."
     ],
     "screenshotPlaceholder": {
      "id": "ss-2-2",
      "label": "Screenshot Placeholder 2.2: Task Manager Compact vs. Detailed Processes View",
      "description": "Side-by-side comparison screenshot showing the compact Task Manager dialog and the full table view after clicking \"More details\".",

     }
    },
    {
     "stepNumber": 3,
     "title": "Inspect and Sort by CPU Usage",
     "instruction": "Locate the \"CPU\" column header at the top of the processes list. Click once on the word \"CPU\" to sort the table in descending order so the highest percentage appears at the top.",
     "details": [
      "Normal idle behavior: The total CPU usage across the system should typically fluctuate between 2% and 25%.",
      "High utilization indicator: If a single non-essential app (like a web browser or background updater) is constantly utilizing 70% to 100% of your CPU, it is the primary reason your computer feels sluggish."
     ],
     "screenshotPlaceholder": {
      "id": "ss-2-3",
      "label": "Screenshot Placeholder 2.3: Task Manager Sorted by CPU Column",
      "description": "Screenshot of the Task Manager Processes tab sorted in descending order by the CPU column, showing an app utilizing high CPU highlighted in amber/red.",
      "aspectRatio": "16:9"
     }
    },
    {
     "stepNumber": 4,
     "title": "Check Memory (RAM) Consumption",
     "instruction": "Click on the \"Memory\" column header to sort running programs by their RAM consumption.",
     "details": [
      "Web browsers with 30+ open tabs, photo editing software, or virtual meeting tools often consume multiple gigabytes (GB) of RAM.",
      "If the overall Memory bar at the top exceeds 90%, closing unused browser tabs or secondary applications will instantly free up breathing room for your computer."
     ],
     "screenshotPlaceholder": {
      "id": "ss-2-4",
      "label": "Screenshot Placeholder 2.4: Processes Sorted by Memory Column",
      "description": "Screenshot displaying the Memory column sorted descending, showing browser helper processes consuming significant megabytes/gigabytes of RAM.",
      "aspectRatio": "16:9"
     }
    },
    {
     "stepNumber": 5,
     "title": "Safely End an Unresponsive or Frozen Application",
     "instruction": "If a user application shows \"(Not Responding)\" or is consuming excessive resources without doing any active work: click once on the application name to select it, then click the \"End task\" button.",
     "details": [
      "In Windows 10, \"End task\" is located in the bottom-right corner of Task Manager.",
      "In Windows 11, \"End task\" is located in the top command bar.",
      "Give Windows 5 to 10 seconds to terminate the stuck process."

     "screenshotPlaceholder": {

    {
     "stepNumber": 6,
     "title": "Verify System Recovery",
     "instruction": "Observe the overall CPU and Memory percentages at the top of the Task Manager table. If they drop down to normal levels (under 40%), test your system by opening a standard document or browser tab.",

      "If the CPU or Disk continues to stay at 100% despite closing all user apps, save your work and perform a standard reboot (Start > Power > Restart)."

   "introduction": "When a document is corrupted, contains unsupported fonts, or the printer momentarily loses communication mid-stream, print jobs can get trapped in the Windows print queue. Once a job is stuck, all subsequent documents queued behind it will not print. This guide shows you how to clear the stuck job and resume printing smoothly.",

    "Standard Windows user account"

   "steps": [

     "stepNumber": 1,

        case 'pick': P.sel = id; renderMain(); return;
        case 'toggle-topic': P.open = P.open === id ? '' : id; renderMain(); return;
        case 'toggle-faq': P.open[id] = !P.open[id]; renderMain(); return;
        case 'tut-cat': P.cat = id; $('#tut-pills').innerHTML = tutPills(); $('#tut-results').innerHTML = tutResults(); icons(); return;
        case 'clear-tut-search': P.q = ''; $('#tut-search').value = ''; $('#tut-clear').classList.add('hidden'); $('#tut-results').innerHTML = tutResults(); icons(); return;
        case 'reset-tut': P.cat = 'All Tutorials'; P.q = ''; renderMain(); return;
        case 'open-tut': openTut(id); return;
        case 'close-tut': closeTut(); return;
        case 'tut-contact': closeTut(); go('contact'); return;
        case 'copy-link':
          if (navigator.clipboard) { navigator.clipboard.writeText(location.href.split('#')[0]); const b = $('#tut-share'); b.innerHTML = ic('check', 'w-4 h-4 text-emerald-600') + '<span class="text-emerald-700 font-medium hidden sm:inline">Copied</span>'; icons(); setTimeout(() => { if ($('#tut-share')) { $('#tut-share').innerHTML = ic('file-text', 'w-4 h-4') + '<span class="hidden sm:inline">Share</span>'; icons(); } }, 2000); }
          return;
        case 'reset-contact': P.sub = null; renderMain(); return;
        case 'chat-open': S.chatOpen = true; renderChat(); $('#chat-input').focus(); return;
        case 'chat-close': S.chatOpen = false; renderChat(); return;
        case 'chat-chip': S.chatInput = id; $('#chat-input').value = id; $('#chat-input').focus(); return;
      }
    }
    if (e.target.id === 'tut-overlay') { closeTut(); return; }
    if (e.target.id === 'sr-overlay') { closeSearch(); return; }
    if (n) { if (S.searchOpen) closeSearch(); go(n.dataset.nav, n.dataset.target); }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'sr-input') setSearchQ(e.target.value);
    else if (e.target.id === 'tut-search') { P.q = e.target.value; $('#tut-clear').classList.toggle('hidden', !P.q); $('#tut-results').innerHTML = tutResults(); icons(); }
    else if (e.target.id === 'chat-input') S.chatInput = e.target.value;
  });
  document.addEventListener('focusin', (e) => { if (e.target.id === 'hero-search-input') { e.target.blur(); openSearch(); } });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.id === 'hero-search-form') openSearch();
    else if (e.target.id === 'contact-form') {
      const v = (id) => $('#' + id).value.trim();
      if (!v('contact-name') || !v('contact-email') || !v('contact-description')) return;
      const data = { fullName: v('contact-name'), email: v('contact-email'), category: $('#contact-category').value, description: v('contact-description'), submittedAt: nowT() };
      try { const l = JSON.parse(localStorage.getItem('demo_support_requests') || '[]'); l.push(data); localStorage.setItem('demo_support_requests', JSON.stringify(l)); } catch (err) { /* ignore storage errors */ }
      P.sub = data; renderMain();
    } else if (e.target.id === 'chat-form') {
      const text = S.chatInput.trim(); if (!text) return;
      S.chatMsgs.push({ from: 'user', text, time: nowT() }); S.chatInput = ''; renderChat();
      const box = $('#chat-input'); if (box) box.focus();
      setTimeout(() => { S.chatMsgs.push({ from: 'bot', text: botReply(text), time: nowT() }); if (S.chatOpen) { renderChat(); } }, 600);
    }
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); S.searchOpen ? closeSearch() : openSearch(); }
    if (e.key === 'Escape') { if (S.searchOpen) closeSearch(); else if (P.active) closeTut(); }
  });
  window.addEventListener('hashchange', route);
  renderChat();
  route();
})();

document.getElementById('boot')&&document.getElementById('boot').remove();</script>
